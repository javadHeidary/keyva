name: keyva
description: "Keyva is a secure local-first password management application"

publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localization: ^0.3.3
  flutter_svg: ^2.2.3
  get: ^4.7.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  iranian_banks: ^2.0.0
  persian_number_utility: ^1.1.6
  shamsi_date: ^1.1.1
  flutter_expandable_fab: ^2.5.2
  lucide_icons_flutter: ^3.1.22
  fan_floating_menu: ^0.0.3
  flutter_spinkit: ^5.2.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  get_it: ^9.2.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  file_picker: ^8.3.7
  cached_network_image_plus: ^0.0.5
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  path_provider: ^2.1.5
  gal: ^2.3.2
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_gen: ^5.10.0
  flutter_gen_runner: ^5.10.0
  build_runner: ^2.12.0
  hive_ce_generator: ^1.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Kalameh
      fonts:
        - asset: assets/fonts/kalameh/Kalameh-Thin.ttf
          weight: 100
        - asset: assets/fonts/kalameh/Kalameh-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/kalameh/Kalameh-Light.ttf
          weight: 300
        - asset: assets/fonts/kalameh/Kalameh-Regular.ttf
          weight: 400
        - asset: assets/fonts/kalameh/Kalameh-Medium.ttf
          weight: 500
        - asset: assets/fonts/kalameh/Kalameh-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/kalameh/Kalameh-Bold.ttf
          weight: 700
        - asset: assets/fonts/kalameh/Kalameh-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/kalameh/Kalameh-Black.ttf
          weight: 900
    - family: "Kalameh(FaNum)"
      fonts:
        - asset: assets/fonts/kalameh/KalamehFaNum-Thin.ttf
          weight: 100
        - asset: assets/fonts/kalameh/KalamehFaNum-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/kalameh/KalamehFaNum-Light.ttf
          weight: 300
        - asset: assets/fonts/kalameh/KalamehFaNum-Regular.ttf
          weight: 400
        - asset: assets/fonts/kalameh/KalamehFaNum-Medium.ttf
          weight: 500
        - asset: assets/fonts/kalameh/KalamehFaNum-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/kalameh/KalamehFaNum-Bold.ttf
          weight: 700
        - asset: assets/fonts/kalameh/KalamehFaNum-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/kalameh/KalamehFaNum-Black.ttf
          weight: 900

flutter_gen:
  output: lib/core/gen/
  line_length: 80
  integrations:
    flutter_svg: true
